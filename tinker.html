<script type="module">
  import * as tinker from "./tinker.js";
  import * as term from "./term.js";

  let Prolog;
  let Module;
  let Tinker;
  let Term;

  var options = {
    arguments: ['-g', 'true'],
    locateFile: function(file) {
      return '/wasm/' + file;
    },
    on_output: print_output
  };

  function print_output(line, cls, sgr) {
    Tinker.console.print(line, cls, sgr);
  }

  SWIPL(options).then(async (module) => {
    Module = module;
    Prolog = Module.prolog;
    Tinker = new tinker.Tinker({
      root:document.querySelector("div.content"),
      module:module,
      banner:true
    });
    window.prolog = Prolog;
    window.tinker = Tinker;
    window.Module = Module;
    window.Prolog = Prolog;
    Term = new term.Term(Tinker.console.elem);

    // Update the URL from the current input
    // The URL-update logic has been moved into the "FINAL SOLUTION" script
    // to avoid conflicts and truncation caused by a competing short-debounce path.

    // Attach the listeners to the console input
    function attachInputListeners() {
      const consoleInput = document.querySelector('.tinker-console input[type="text"]') ||
                          document.querySelector('.tinker-console textarea');

      if (consoleInput && !consoleInput.dataset.listenersAttached) {
        consoleInput.dataset.listenersAttached = 'true';

        // The 'input' and 'keydown' listeners were removed here,
        // because the last script handles that more robustly.

        console.log('✓ URL listeners attached to console input (only flag set)');
        return true;
      }
      return false;
    }

    // Try to attach right away
    setTimeout(attachInputListeners, 1000);

    // Watch the console for changes, to re-attach if the input is recreated
    const observer = new MutationObserver(() => {
      const input = document.querySelector('.tinker-console input[type="text"]') ||
                   document.querySelector('.tinker-console textarea');
      if (input && !input.dataset.listenersAttached) {
        attachInputListeners();
      }
    });

    const consoleDiv = document.querySelector('.tinker-console');
    if (consoleDiv) {
      observer.observe(consoleDiv, { childList: true, subtree: true });
    }

    // Fallback: retry periodically
    setInterval(() => {
      const input = document.querySelector('.tinker-console input[type="text"]') ||
                   document.querySelector('.tinker-console textarea');
      if (input && !input.dataset.listenersAttached) {
        attachInputListeners();
      }
    }, 2000);

    window.checkAndExecuteURLQuery();
  });
</script>

<script>
  add_one = (n) => n+1;

  promise_any = (data) => {
    console.log(data);
    return new Promise(function(resolve, reject) {
      resolve(data);
    });
  }

  window.lastQuery = '';

  window.checkAndExecuteURLQuery = function() {
    if (window.location.hash) {
      const hash = window.location.hash.substring(1);
      const query = window.G4micShare ? window.G4micShare.decompress(hash) : decodeURIComponent(hash);
      if (query) {
        const waitForConsoleInput = setInterval(() => {
          const consoleInput = document.querySelector('.tinker-console input[type="text"]') ||
                              document.querySelector('.tinker-console textarea');

          if (consoleInput && window.tinker && window.tinker.console) {
            clearInterval(waitForConsoleInput);

            console.log('Console ready, executing query:', query);
            consoleInput.value = query;
            window.lastQuery = query;

            setTimeout(() => {
              // Try to find and call the actual submit function
              if (window.tinker.console.emit) {
                window.tinker.console.emit('submit', query);
              } else if (window.tinker.console.onsubmit) {
                window.tinker.console.onsubmit(query);
              } else {
                // Fallback: simulate Enter event more thoroughly
                consoleInput.focus();
                const events = ['keydown', 'keypress', 'keyup'];
                events.forEach(eventType => {
                  const evt = new KeyboardEvent(eventType, {
                    key: 'Enter',
                    code: 'Enter',
                    keyCode: 13,
                    which: 13,
                    charCode: 13,
                    bubbles: true,
                    cancelable: true
                  });
                  consoleInput.dispatchEvent(evt);
                });
              }
              console.log('Query execution attempted');
            }, 800);
          }
        }, 100);

        setTimeout(() => clearInterval(waitForConsoleInput), 10000);
      }
    }
  };
</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {

    window.latexBlocks = [];

    let lastConsoleContent = '';
    let buttonsAdded = false;

    function extractAllLatexBlocks() {
      const consoleDiv = document.querySelector('.tinker-console');
      if (!consoleDiv) return [];

      const textContent = consoleDiv.textContent || consoleDiv.innerText;
      const blocks = [];

      const prooftrees = textContent.match(/\\begin\{prooftree\}[\s\S]*?\\end\{prooftree\}/g) || [];
      const fitches = textContent.match(/\\begin\{fitch\}[\s\S]*?\\end\{fitch\}/g) || [];

      prooftrees.forEach(block => blocks.push({ type: 'prooftree', code: block }));
      fitches.forEach(block => blocks.push({ type: 'fitch', code: block }));

      return blocks;
    }

    function addCopyButtonsToConsole() {
      const consoleDiv = document.querySelector('.tinker-console');
      if (!consoleDiv) return;

      const currentContent = consoleDiv.textContent || '';

      if (currentContent === lastConsoleContent) return;
      lastConsoleContent = currentContent;
      buttonsAdded = false;

      if (!currentContent.includes('\\begin{prooftree}') && !currentContent.includes('\\begin{fitch}')) {
        return;
      }

      window.latexBlocks = extractAllLatexBlocks();

      if (window.latexBlocks.length === 0 || buttonsAdded) return;

      console.log('🔍 Starting button creation, latexBlocks:', window.latexBlocks.map((b, i) => `[${i}]:${b.type}`).join(', '));

      // COLLECT EVERY NODE FIRST, so none is lost while the DOM is manipulated
      const walker = document.createTreeWalker(
        consoleDiv,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );

      const patternsToMatch = [
        { pattern: /^\\end\{prooftree\}$/m, blockType: 'prooftree' },
        { pattern: /^\\end\{fitch\}$/m, blockType: 'fitch' }
      ];

      // Collect every matching node
      const nodesToProcess = [];
      let node;
      while (node = walker.nextNode()) {
        for (const item of patternsToMatch) {
          if (item.pattern.test(node.textContent)) {
            const parent = node.parentElement;
            if (parent && !parent.querySelector('.latex-copy-btn')) {
              nodesToProcess.push({ node, parent, blockType: item.blockType });
            }
            break;
          }
        }
      }

      console.log(`📋 Found ${nodesToProcess.length} nodes to process`);

      // Now process all the nodes
      let prooftreeCount = 0;
      let fitchCount = 0;

      nodesToProcess.forEach(({ node, parent, blockType }) => {
        // Total count of each kind in latexBlocks
        const numProoftrees = window.latexBlocks.filter(b => b.type === 'prooftree').length;

        // Index: for prooftree it is prooftreeCount,
        // for fitch it is numProoftrees + fitchCount
        const blockIndex = blockType === 'prooftree' ? prooftreeCount : numProoftrees + fitchCount;

        console.log(`➕ Creating button: type=${blockType}, prooftreeCount=${prooftreeCount}, fitchCount=${fitchCount}, blockIndex=${blockIndex}`);

        if (blockType === 'prooftree') prooftreeCount++;
        else fitchCount++;

        const span = document.createElement('span');
        span.className = 'latex-section-marker';
        span.textContent = node.textContent;

        const btn = document.createElement('button');
        btn.className = 'latex-copy-btn';
        btn.textContent = '📋 Copy LaTeX';
        btn.dataset.blockIndex = blockIndex;
        btn.onclick = function() {
          const idx = parseInt(this.dataset.blockIndex);
          console.log(`🖱️ Button clicked: stored index=${this.dataset.blockIndex}, parsed=${idx}, block type=${window.latexBlocks[idx]?.type}`);
          copyLatexBlock(idx);
        };

        span.appendChild(btn);
        parent.replaceChild(span, node);
        buttonsAdded = true;
      });

      console.log(`✅ Created ${prooftreeCount} prooftree buttons and ${fitchCount} fitch buttons`);
    }

    function copyLatexBlock(index) {
      if (window.latexBlocks[index]) {
        const latex = window.latexBlocks[index].code;
        navigator.clipboard.writeText(latex).then(() => {
          alert('LaTeX code copied to clipboard!');
        }).catch(err => {
          alert('Failed to copy to clipboard');
        });
      }
    }

        navigator.clipboard.writeText(url).then(() => {

function shareURL() {
      // 1. Try to read the current value of the input field
      const consoleInput = document.querySelector('.tinker-console input[type="text"]') ||
                           document.querySelector('.tinker-console textarea');
      // Start from the trimmed input value, or an empty string
      let query = consoleInput ? consoleInput.value.trim() : '';

      // 2. FALLBACK: if the input is empty, use the last executed query (window.lastQuery)
      if (!query && window.lastQuery) {
          query = window.lastQuery;
      }

      // 3. Proceed ONLY if a valid query exists, current or remembered
      if (query) {
        // Update lastQuery to keep the two in step
        window.lastQuery = query;

        // Encode the whole query (keeps the final period and closing parentheses)
        const url = window.location.origin + window.location.pathname + '#' + encodeURIComponent(query);

        navigator.clipboard.writeText(url).then(() => {
          alert('Shareable URL copied!\nShare this link to show the same proof.');
        }).catch(() => {
          prompt('Copy this URL:', url);
        });
      } else {
        alert('No query to share. Execute a prove() query first.');
      }
    }


    setInterval(addCopyButtonsToConsole, 1000);

    // ===== MathJax RENDERING, WITH FLICKER SUPPRESSION =====

    let lastRenderedContent = {
      sequent: '',
      tree: '',
      fitch: ''
    };

    let isRendering = false;

    // ===== FITCH PARSER - LaTeX to SVG =====
    /**
     * Parse one LaTeX Fitch line
     */
    function parseFitchLine(line) {
      line = line.trim();
      if (!line || line === '') return null;

      // Skip lines that have none of \fa, \fh, \fj
      if (!line.includes('\\fa') && !line.includes('\\fh') && !line.includes('\\fj')) {
        return null;
      }

      // Count EVERY vertical line (\fa + \fh + \fj)
      const faMatches = line.match(/\\fa/g);
      const fhMatches = line.match(/\\fh/g);
      const fjMatches = line.match(/\\fj/g);
      const faCount = faMatches ? faMatches.length : 0;
      const fhCount = fhMatches ? fhMatches.length : 0;
      const fjCount = fjMatches ? fjMatches.length : 0;
      const indentLevel = faCount + fhCount + fjCount;  // total number of vlines

      // \fh marks a flagged hypothesis
      const hasFlag = fhCount > 0;

      // \fj marks the last premise (with the closing flag)
      const isPremise = fjCount > 0;

      let content = line
        .replace(/\\fa/g, '')
        .replace(/\\fh/g, '')
        .replace(/\\fj/g, '')
        .trim();

      const parts = content.split('&');
      let formula = parts[0].trim();
      let justification = parts[1] ? parts[1].trim() : '';

      // KEEP the original LaTeX for MathJax
      formula = formula.replace(/\\\\/g, '').trim();

      // Clean up the justifications
      justification = justification
        .replace(/\$/g, '')
        .replace(/\\\\/g, '')
        .trim();

      return { indentLevel, hasFlag, isPremise, formula, justification };
    }

    function parseFitchProof(latexCode) {
      const match = latexCode.match(/\\begin\{fitch\}([\s\S]*?)\\end\{fitch\}/);
      if (!match) return null;

      const content = match[1];
      const lines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      const parsedLines = [];
      for (let i = 0; i < lines.length; i++) {
        const parsed = parseFitchLine(lines[i]);
        if (parsed) {
          parsed.lineNumber = i + 1;
          parsedLines.push(parsed);
        }
      }
      return parsedLines;
    }

    function generateFitchSVG(lines) {
      if (!lines || lines.length === 0) return '';

      const X_NUM = 30, X_START = 60, INDENT_WIDTH = 20;
      const Y_START = 30, LINE_HEIGHT = 35, FLAG_WIDTH = 30;
      const FORMULA_OFFSET = 9; // gap between the vline and the formula

      // X_JUSTIF: aligned column, based on the formula reaching furthest right
      // (indentation + formula length), estimating ~9px per MathJax character
      const maxFormulaRight = Math.max(...lines.map(l => {
        const xPos = X_START + ((l.indentLevel - 1) * INDENT_WIDTH) + FORMULA_OFFSET;
        return xPos + (l.formula.length * 9);
      }));
      const X_JUSTIF = maxFormulaRight + 30; // comfortable margin between formula and justification

      // SVG width, from the formulas plus the justifications
      const maxJustifLength = Math.max(...lines.map(l => l.justification ? l.justification.length : 0));
      const svgWidth = Math.max(650, X_JUSTIF + (maxJustifLength * 8) + 40);

      // Extra spacing, used to estimate the height
      let estimatedExtraSpace = 0;
      for (let i = 1; i < lines.length; i++) {
        if (lines[i].hasFlag && lines[i-1].indentLevel >= lines[i].indentLevel) {
          // Check that a deeper subproof came before
          for (let j = i - 1; j >= 0 && j >= i - 5; j--) {
            if (lines[j].indentLevel > lines[i].indentLevel) {
              estimatedExtraSpace += 10;
              break;
            }
          }
        }
      }

      const svgHeight = Y_START + (lines.length * LINE_HEIGHT) + estimatedExtraSpace + 50;

      let svg = `<svg width="${svgWidth}" height="${svgHeight}" xmlns="http://www.w3.org/2000/svg">`;
      svg += `<defs><style>
        .line-num { font-family: 'Times New Roman', serif; font-size: 14px; fill: #666; }
        .justif { font-family: 'Times New Roman', serif; font-size: 14px; fill: #555; }
      </style></defs>`;

      // FIRST COMPUTE THE Y POSITION OF EVERY LINE (spacing included)
      const lineYPositions = [];
      let cumulativeSpace = 0;

      for (let i = 0; i < lines.length; i++) {
        // Detect gaps between subproofs at the same level
        if (i > 0 && lines[i].hasFlag && lines[i-1].indentLevel >= lines[i].indentLevel) {
          for (let j = i - 1; j >= 0 && j >= i - 5; j--) {
            if (lines[j].indentLevel > lines[i].indentLevel) {
              cumulativeSpace += 10;
              break;
            }
          }
        }
        lineYPositions[i] = Y_START + (i * LINE_HEIGHT) + cumulativeSpace;
      }

      // DRAW THE VERTICAL LINES, with gaps for subproofs
      const maxIndent = Math.max(...lines.map(l => l.indentLevel));
      for (let level = 1; level <= maxIndent; level++) {
        const x = X_START + ((level - 1) * INDENT_WIDTH);
        let segmentStart = null;

        for (let i = 0; i < lines.length; i++) {
          const hasThisLevel = lines[i].indentLevel >= level;
          // Decide whether a gap is needed (a new subproof at the same level)
          const shouldBreak = i > 0 &&
                             lines[i].hasFlag &&
                             lines[i].indentLevel === level &&
                             lines[i-1].indentLevel >= level;

          if (hasThisLevel && !shouldBreak) {
            if (segmentStart === null) segmentStart = i;
          } else {
            if (segmentStart !== null) {
              const y1 = lineYPositions[segmentStart] - 15;

        const y = lineYPositions[index];

        const xBase = X_START + ((line.indentLevel - 1) * INDENT_WIDTH) + FORMULA_OFFSET;

              // IMPORTANT: do not clear when we have just loaded from a URL
              if (!loadedFromURL) {
                console.log('🧹 Clearing console (user typed new query)');
                // VIDER LA CONSOLE
                setTimeout(() => {
                  clearConsoleOutput();
                }, 10);
              } else {
                console.log('⏭️  Skipping clear (loaded from URL)');
                // Clear the flag after this run
                setTimeout(() => {
                  loadedFromURL = false;
                  console.log('✅ URL query executed, clearing now enabled');
                }, 2000);
              }

              lastExecutedQuery = query;
            } else {
              console.log('↩️  Same query as before, no clear needed');
            }
          }
        }
      });

      // Also update the URL while typing (debounced)
      let inputTimeout;
      input.addEventListener('input', function() {
        clearTimeout(inputTimeout);
        inputTimeout = setTimeout(() => {
          const query = this.value.trim();
          if (query && (query.startsWith('prove(') || query.startsWith('decide('))) {
            window.lastQuery = query;
            const compressed = window.G4micShare ? window.G4micShare.compress(query) : encodeURIComponent(query);
            window.location.hash = '#' + compressed;
            console.log('🔗 URL updated on Input (debounce):', window.location.hash);
          }
        }, 800); // <- 800ms delay, to avoid truncation
      });

      console.log('✅ Clear listener attached to input');
    });
  }

  // Observer that re-attaches when new inputs appear
  const observer = new MutationObserver(() => {
    attachClearListener();
  });

  const consoleDiv = document.querySelector('.tinker-console');
  if (consoleDiv) {
    observer.observe(consoleDiv, { childList: true, subtree: true });
  }

  // Attach on a regular tick
  setInterval(attachClearListener, 2000);

  // First attempt
  setTimeout(attachClearListener, 1000);

  console.log('🚀 Console clearing system initialized with URL protection');
  })();
</script>
<script>
 // PARENTHESIS MATCHING FOR THE CONSOLE
 function checkParenthesesBalance(input) {
     const value = input.value;
     const openParens = (value.match(/\(/g) || []).length;
     const closeParens = (value.match(/\)/g) || []).length;

     // Remove the previous classes
     input.classList.remove('parens-unbalanced', 'parens-highlight');

     // Add the appropriate class
     if (openParens !== closeParens) {
         input.classList.add('parens-unbalanced');
     }
     if (value.includes('(') || value.includes(')')) {
         input.classList.add('parens-highlight');
     }
 }

 function enhanceConsoleInputs() {
     const inputs = document.querySelectorAll('.tinker-console input[type="text"], .tinker-console textarea, .tinker-input input');

     inputs.forEach(input => {
         if (input.hasAttribute('data-parenthesis-enhanced')) return;
         input.setAttribute('data-parenthesis-enhanced', 'true');

         // Check right away
         checkParenthesesBalance(input);

         // Check on every keystroke
         input.addEventListener('input', function() {
             checkParenthesesBalance(this);
         });
     });
 }

 // Surveiller en permanence
 setInterval(enhanceConsoleInputs, 1000);
 document.addEventListener('DOMContentLoaded', enhanceConsoleInputs);
</script>

<!-- TPTP Handler -->
<script>
window.addEventListener('load', function() {
  setTimeout(initTPTPHandler, 2000);
});

function initTPTPHandler() {
  let processingTPTP = false;
  const btn = document.getElementById('prove-tptp-btn');
  const uploadBtn = document.getElementById('tptp-upload-btn');
  const fileInput = document.getElementById('tptp-file-input');

  if (!btn || !uploadBtn || !fileInput) return;

  // Clicking the upload button triggers the file input
  uploadBtn.addEventListener('click', function(e) {
    e.preventDefault();
    fileInput.click();
  });

  // Once a file is selected, show the Prove button
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) {
      btn.style.display = 'inline';
      btn.textContent = 'Prove ' + fileInput.files[0].name;
    } else {
      btn.style.display = 'none';
    }
  });

  btn.addEventListener('click', function() {
    if (processingTPTP) {
      alert('Already processing a TPTP file. Please wait...');
      return;
    }

    const fileInput = document.getElementById('tptp-file-input');
    const file = fileInput.files[0];

    if (!file) {
      alert('Please select a TPTP .p file first');
      return;
    }

    processingTPTP = true;
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const reader = new FileReader();
    reader.onload = function(e) {
      processTPTPFile(file.name, e.target.result);
    };
    reader.onerror = function() {
      showTPTPError('Failed to read file');
      resetTPTPButton();
    };
    reader.readAsText(file);
  });

  function processTPTPFile(filename, content) {
    if (!window.tinker || !window.Prolog || !window.Module) {
      setTimeout(() => processTPTPFile(filename, content), 500);
      return;
    }

    try {
      const tempFilename = '/tmp/problem.p';
      window.Module.FS.writeFile(tempFilename, content);

      // Print a message in the console
      window.tinker.console.print(`\n📄 Processing TPTP file: ${filename}`, 'query');

      // Run the proof -- the output goes straight to the console
      window.Prolog.call(`prove_tptp_file('${tempFilename}')`);

    } catch (error) {
      window.tinker.console.print(`\n❌ Error: ${error.message}`, 'error');
    } finally {
      resetTPTPButton();
    }
  }

  function showTPTPError(message) {
    window.tinker.console.print(`\n❌ ${message}`, 'error');
  }

  function resetTPTPButton() {
    processingTPTP = false;
    btn.disabled = false;
    btn.style.display = 'none';
    fileInput.value = '';
  }
}
</script>

<!-- FOF-to-prove Handler -->
<script>
(function() {
  window.addEventListener('load', function() {
    setTimeout(function() {
      let processingConvert = false;
      const convertBtn = document.getElementById('fof-convert-btn');
      const convertUploadBtn = document.getElementById('fof-convert-upload-btn');
      const convertInput = document.getElementById('fof-convert-input');

      if (!convertBtn || !convertUploadBtn || !convertInput) return;

      convertUploadBtn.addEventListener('click', function(e) {
        e.preventDefault();
        convertInput.click();
      });

      convertInput.addEventListener('change', function() {
        if (convertInput.files.length > 0) {
          convertBtn.style.display = 'inline';
          convertBtn.textContent = 'LaTeX proofs for ' + convertInput.files[0].name;
        } else {
          convertBtn.style.display = 'none';
        }
      });

      convertBtn.addEventListener('click', function() {
        if (processingConvert) {
          alert('Already converting. Please wait...');
          return;
        }

        const file = convertInput.files[0];
        if (!file) {
          alert('Please select a TPTP .p file first');
          return;
        }

        processingConvert = true;
        convertBtn.disabled = true;
        convertBtn.textContent = 'Converting...';

        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            if (!window.tinker || !window.Prolog || !window.Module) {
              window.tinker.console.print('\n❌ Prolog engine not ready yet. Please wait.', 'error');
              return;
            }
            const tempFilename = '/tmp/convert.p';
            window.Module.FS.writeFile(tempFilename, e.target.result);
            window.tinker.console.print(`\n📄 Converting FOF file: ${file.name}`, 'query');
            window.Prolog.call(`fof_to_prove_run('${tempFilename}')`);
          } catch (error) {
            window.tinker.console.print(`\n❌ Error: ${error.message}`, 'error');
          } finally {
            processingConvert = false;
            convertBtn.disabled = false;
            convertBtn.style.display = 'none';
            convertInput.value = '';
          }
        };
        reader.onerror = function() {
          window.tinker.console.print('\n❌ Failed to read file', 'error');
          processingConvert = false;
          convertBtn.disabled = false;
          convertBtn.style.display = 'none';
          convertInput.value = '';
        };
        reader.readAsText(file);
      });
    }, 2000);
  });
})();
</script>
